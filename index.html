<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डोले Wala Gym</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .card h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .card p {
      color: #aaa;
    }

    .section {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h2 {
      margin-bottom: 18px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .full {
      grid-column: 1 / -1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      overflow: hidden;
    }

    th,
    td {
      border-bottom: 1px solid #333;
      padding: 12px 8px;
      text-align: left;
    }

    th {
      background: #111;
    }

    .delete {
      background: #333;
      color: white;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px;
    }

    @media (max-width: 700px) {
      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>💪 डोले Wala Gym</h1>
    <p>Gym Management System</p>
  </header>

  <div class="container">

    <div class="dashboard">
      <div class="card">
        <h2 id="totalMembers">0</h2>
        <p>Total Members</p>
      </div>

      <div class="card">
        <h2 id="activeMembers">0</h2>
        <p>Active Members</p>
      </div>

      <div class="card">
        <h2 id="expiredMembers">0</h2>
        <p>Expired Members</p>
      </div>

      <div class="card">
        <h2 id="todayMembers">0</h2>
        <p>Today's Entries</p>
      </div>
    </div>

    <div class="section">
      <h2>➕ Add New Member</h2>

      <form id="memberForm">

        <input
          type="text"
          id="name"
          placeholder="Member Name"
          required
        >

        <input
          type="tel"
          id="phone"
          placeholder="Phone Number"
          required
        >

        <input
          type="number"
          id="entryFee"
          placeholder="Entry Fee"
        >

        <input
          type="number"
          id="membershipFee"
          placeholder="Membership Fee"
        >

        <input
          type="date"
          id="joiningDate"
          required
        >

        <input
          type="date"
          id="expiryDate"
          required
        >

        <select id="plan">
          <option value="">Select Plan</option>
          <option value="1 Month">1 Month</option>
          <option value="3 Months">3 Months</option>
          <option value="6 Months">6 Months</option>
          <option value="12 Months">12 Months</option>
        </select>

        <select id="gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <select id="status">
          <option value="Active">Active</option>
          <option value="Expired">Expired</option>
        </select>

        <textarea
          id="notes"
          class="full"
          placeholder="Notes"
        ></textarea>
<input type="file" id="photo" accept="image/*" class="full" />
        <button type="submit" class="full">
          Add Member
        </button>

      </form>
    </div>

    <div class="section">
      <h2>👥 Members</h2>

      <input
        type="text"
        id="search"
        placeholder="Search member by name or phone..."
      >

      <div id="membersTable"></div>
    </div>

  </div>

  <script>

    let members = JSON.parse(
      localStorage.getItem("doleWalaGymMembers")
    ) || [];

    const form = document.getElementById("memberForm");
    const search = document.getElementById("search");

    function saveMembers() {
      localStorage.setItem(
        "doleWalaGymMembers",
        JSON.stringify(members)
      );
    }

    function updateDashboard() {

      const today = new Date().toISOString().split("T")[0];

      document.getElementById("totalMembers").textContent =
        members.length;

      document.getElementById("activeMembers").textContent =
        members.filter(m => m.status === "Active").length;

      document.getElementById("expiredMembers").textContent =
        members.filter(m => m.status === "Expired").length;

      document.getElementById("todayMembers").textContent =
        members.filter(m => m.joiningDate === today).length;
    }

    function displayMembers(list = members) {

      const table = document.getElementById("membersTable");

      if (list.length === 0) {
        table.innerHTML =
          '<div class="empty">No members added yet.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Plan</th>
              <th>Joining</th>
              <th>Expiry</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
      `;

      list.forEach(member => {

        html += `
          <tr>
            <td>${member.name}</td>
            <td>${member.phone}</td>
            <td>${member.plan}</td>
            <td>${member.joiningDate}</td>
            <td>${member.expiryDate}</td>
            <td>${member.status}</td>
            <td>
  <button
    class="edit"
    onclick="editMember(${member.id})"
  >
    Edit
  </button>

  <button
    class="delete"
    onclick="deleteMember(${member.id})"
  >
    Delete
  </button>
</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      table.innerHTML = html;
    }

    form.addEventListener("submit", function(e) {

      e.preventDefault();

      const member = {

        id: Date.now(),

        name: document.getElementById("name").value,

        phone: document.getElementById("phone").value,

        entryFee:
          document.getElementById("entryFee").value,

        membershipFee:
          document.getElementById("membershipFee").value,

        joiningDate:
          document.getElementById("joiningDate").value,

        expiryDate:
          document.getElementById("expiryDate").value,

        plan:
          document.getElementById("plan").value,

        gender:
          document.getElementById("gender").value,

        status:
          document.getElementById("status").value,

        notes:
          document.getElementById("notes").value
      };

      members.push(member);

      saveMembers();

      form.reset();

      updateDashboard();

      displayMembers();

      alert("Member added successfully!");
    });

    function deleteMember(id) {

      const confirmDelete =
        confirm("Are you sure you want to delete this member?");

      if (!confirmDelete) return;

      members =
        members.filter(member => member.id !== id);

      saveMembers();

      updateDashboard();

      displayMembers();
    }

    search.addEventListener("input", function() {

      const value =
        search.value.toLowerCase();

      const filtered =
        members.filter(member =>
          member.name.toLowerCase().includes(value) ||
          member.phone.includes(value)
        );

      displayMembers(filtered);
    });

    updateDashboard();

    displayMembers();

  </script>

</body>
</html>
