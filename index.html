<script>

/* =========================================================
   DATA
========================================================= */

let members = [];

let currentProfileId = null;

const STORAGE_KEY = "doleWalaGymMembers";

const PHOTO_DB = "DoleWalaGymPhotos";

const PHOTO_STORE = "photos";


/* =========================================================
   LOGIN
========================================================= */

function login(){

const username =
document.getElementById("loginUsername").value.trim();

const password =
document.getElementById("loginPassword").value;

if(username === "admin" && password === "1234"){

localStorage.setItem(
"doleWalaGymLoggedIn",
"true"
);

showApp();

}else{

const box =
document.getElementById("loginError");

box.textContent =
"Username ya password galat hai.";

box.classList.remove("hidden");

}

}


function logout(){

localStorage.removeItem(
"doleWalaGymLoggedIn"
);

location.reload();

}


function showApp(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

loadData();

}


/* =========================================================
   PHOTO INDEXED DB
========================================================= */

function openPhotoDB(){

return new Promise((resolve,reject)=>{

const request =
indexedDB.open(
PHOTO_DB,
1
);

request.onupgradeneeded = function(e){

const db =
e.target.result;

if(!db.objectStoreNames.contains(PHOTO_STORE)){

db.createObjectStore(
PHOTO_STORE
);

}

};

request.onsuccess = function(){

resolve(request.result);

};

request.onerror = function(){

reject(request.error);

};

});

}


async function savePhoto(id,file){

if(!file) return null;

const db =
await openPhotoDB();

return new Promise((resolve,reject)=>{

const tx =
db.transaction(
PHOTO_STORE,
"readwrite"
);

tx.objectStore(PHOTO_STORE)
.put(
file,
String(id)
);

tx.oncomplete =
()=>resolve(true);

tx.onerror =
()=>reject(tx.error);

});

}


async function getPhoto(id){

try{

const db =
await openPhotoDB();

return new Promise((resolve)=>{

const tx =
db.transaction(
PHOTO_STORE,
"readonly"
);

const request =
tx.objectStore(PHOTO_STORE)
.get(String(id));

request.onsuccess =
function(){

const file =
request.result;

if(!file){

resolve("");

return;

}

resolve(
URL.createObjectURL(file)
);

};

request.onerror =
()=>resolve("");

});

}catch(e){

return "";

}

}


async function deletePhoto(id){

try{

const db =
await openPhotoDB();

const tx =
db.transaction(
PHOTO_STORE,
"readwrite"
);

tx.objectStore(PHOTO_STORE)
.delete(String(id));

}catch(e){

console.log(e);

}

}


/* =========================================================
   DATA LOAD
========================================================= */

function loadData(){

const saved =
localStorage.getItem(
STORAGE_KEY
);

try{

members =
saved
? JSON.parse(saved)
: [];

}catch(e){

members = [];

}

updateStatuses();

displayMembers();

updateDashboard();

}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(members)
);

}


/* =========================================================
   STATUS
========================================================= */

function getStatus(member){

if(!member.expiryDate){

return member.status || "Active";

}

const today =
new Date();

today.setHours(
0,0,0,0
);

const expiry =
new Date(
member.expiryDate
);

expiry.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(expiry - today) /
86400000
);

if(diff < 0){

return "Expired";

}

if(diff <= 7){

return "Expiring Soon";

}

return "Active";

}


function updateStatuses(){

members.forEach(
member => {

member.status =
getStatus(member);

});

saveData();

}


/* =========================================================
   ADD / EDIT
========================================================= */

document
.getElementById("memberForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const id =
document.getElementById(
"editingId"
).value;


const data = {

name:
document.getElementById(
"name"
).value.trim(),

phone:
document.getElementById(
"phone"
).value.trim(),

entryFee:
Number(
document.getElementById(
"entryFee"
).value
) || 0,

membershipFee:
Number(
document.getElementById(
"membershipFee"
).value
) || 0,

joiningDate:
document.getElementById(
"joiningDate"
).value,

expiryDate:
document.getElementById(
"expiryDate"
).value,

plan:
document.getElementById(
"plan"
).value,

gender:
document.getElementById(
"gender"
).value,

status:
document.getElementById(
"manualStatus"
).value,

notes:
document.getElementById(
"notes"
).value,

createdAt:
new Date().toISOString()

};


if(!data.name || !data.phone){

showMessage(
"Name aur Phone zaroor bhariye."
);

return;

}


const photoFile =
document.getElementById(
"photo"
).files[0];


if(id){

const index =
members.findIndex(
m =>
String(m.id) ===
String(id)
);

if(index === -1){

return;

}

const old =
members[index];

members[index] = {

...old,
...data,
id:old.id

};

if(photoFile){

await savePhoto(
old.id,
photoFile
);

}

}else{

const newId =
Date.now();

data.id =
newId;

members.unshift(
data
);

if(photoFile){

await savePhoto(
newId,
photoFile
);

}

}


updateStatuses();

saveData();

displayMembers();

updateDashboard();

resetForm();

showMessage(
id
? "✅ Member updated successfully."
: "✅ Member added successfully."
);

}
);


/* =========================================================
   DISPLAY
========================================================= */

async function displayMembers(list=members){

const tbody =
document.getElementById(
"memberList"
);

tbody.innerHTML = "";

if(!list.length){

tbody.innerHTML =
`
<tr>
<td colspan="8" style="text-align:center">
No members found
</td>
</tr>
`;

return;

}


for(const member of list){

const tr =
document.createElement("tr");

const photo =
await getPhoto(
member.id
);

const status =
getStatus(member);

let statusClass =
"active";

if(status === "Expired"){
statusClass = "expired";
}

if(status === "Expiring Soon"){
statusClass = "expiring";
}


tr.innerHTML = `

<td>
${
photo
?
`<img src="${photo}" class="member-photo">`
:
`<div class="member-photo"
style="display:flex;align-items:center;justify-content:center">
👤
</div>`
}
</td>

<td>
<b>${safe(member.name)}</b>
</td>

<td>
${safe(member.phone)}
</td>

<td>
${safe(member.plan)}
</td>

<td>
${safe(member.joiningDate)}
</td>

<td>
${safe(member.expiryDate)}
</td>

<td>
<span class="status ${statusClass}">
${
status === "Active"
? "🟢 Active"
:
status === "Expired"
? "🔴 Expired"
: "🟡 Expiring Soon"
}
</span>
</td>

<td>

<div class="actions">

<button class="btn"
onclick="viewMember(${member.id})">
👁️
</button>

<button class="btn"
onclick="editMember(${member.id})">
✏️
</button>

<button class="red"
onclick="deleteMember(${member.id})">
🗑️
</button>

</div>

</td>
`;

tbody.appendChild(tr);

}

}


/* =========================================================
   SEARCH
========================================================= */

function searchMembers(){

const q =
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

if(!q){

displayMembers();

return;

}

const result =
members.filter(
m =>
String(m.name)
.toLowerCase()
.includes(q)
||
String(m.phone)
.toLowerCase()
.includes(q)
);

displayMembers(result);

}


/* =========================================================
   PROFILE
========================================================= */

async function viewMember(id){

const member =
members.find(
m =>
String(m.id) ===
String(id)
);

if(!member) return;

currentProfileId =
member.id;

const photo =
await getPhoto(
member.id
);

const img =
document.getElementById(
"profilePhoto"
);

img.src =
photo || "";

const status =
getStatus(member);

document.getElementById(
"profileDetails"
).innerHTML = `

<div class="detail">
<b>Name:</b>
${safe(member.name)}
</div>

<div class="detail">
<b>Phone:</b>
${safe(member.phone)}
</div>

<div class="detail">
<b>Entry Fee:</b>
₹${member.entryFee || 0}
</div>

<div class="detail">
<b>Membership Fee:</b>
₹${member.membershipFee || 0}
</div>

<div class="detail">
<b>Plan:</b>
${safe(member.plan)}
</div>

<div class="detail">
<b>Gender:</b>
${safe(member.gender)}
</div>

<div class="detail">
<b>Joining Date:</b>
${safe(member.joiningDate)}
</div>

<div class="detail">
<b>Expiry Date:</b>
${safe(member.expiryDate)}
</div>

<div class="detail">
<b>Notes:</b>
${safe(member.notes)}
</div>

<div class="detail">
<b>Status:</b>
<span class="status ${
status === "Active"
? "active"
:
status === "Expired"
? "expired"
: "expiring"
}">
${
status === "Active"
? "🟢 Active"
:
status === "Expired"
? "🔴 Expired"
: "🟡 Expiring Soon"
}
</span>
</div>

`;

document
.getElementById("profileModal")
.classList.remove("hidden");

}


function closeProfile(){

document
.getElementById("profileModal")
.classList.add("hidden");

}


/* =========================================================
   EDIT
========================================================= */

function editMember(id){

const member =
members.find(
m =>
String(m.id) ===
String(id)
);

if(!member) return;

document.getElementById(
"editingId"
).value =
member.id;

document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Member";


document.getElementById("name").value =
member.name || "";

document.getElementById("phone").value =
member.phone || "";

document.getElementById("entryFee").value =
member.entryFee || 0;

document.getElementById("membershipFee").value =
member.membershipFee || 0;

document.getElementById("joiningDate").value =
member.joiningDate || "";

document.getElementById("expiryDate").value =
member.expiryDate || "";

document.getElementById("plan").value =
member.plan || "";

document.getElementById("gender").value =
member.gender || "";

document.getElementById("manualStatus").value =
"auto";

document.getElementById("notes").value =
member.notes || "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function profileEdit(){

if(currentProfileId){

closeProfile();

editMember(
currentProfileId
);

}

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMember(id){

const member =
members.find(
m =>
String(m.id) ===
String(id)
);

if(!member) return;

const ok =
confirm(
`Kya aap ${member.name} ko permanently delete karna chahte hain?`
);

if(!ok) return;

members =
members.filter(
m =>
String(m.id) !==
String(id)
);

await deletePhoto(id);

saveData();

displayMembers();

updateDashboard();

}


/* =========================================================
   RENEW
========================================================= */

function renewMembership(){

const member =
members.find(
m =>
String(m.id) ===
String(currentProfileId)
);

if(!member) return;

const months =
prompt(
"Renewal kitne months ke liye?\n\n1 = 1 Month\n3 = 3 Months\n6 = 6 Months\n12 = 12 Months",
"1"
);

if(!months) return;

const n =
Number(months);

if(![1,3,6,12].includes(n)){

alert(
"Sirf 1, 3, 6 ya 12 months select karein."
);

return;

}


let start;

if(member.expiryDate){

const expiry =
new Date(
member.expiryDate
);

const today =
new Date();

start =
expiry > today
? expiry
: today;

}else{

start =
new Date();

}


const newExpiry =
new Date(start);

newExpiry.setMonth(
newExpiry.getMonth() + n
);


member.expiryDate =
newExpiry
.toISOString()
.split("T")[0];

member.plan =
n === 1
? "1 Month"
:
n === 3
? "3 Months"
:
n === 6
? "6 Months"
: "12 Months";

member.status =
"Active";


saveData();

displayMembers();

updateDashboard();

viewMember(
member.id
);

alert(
"✅ Membership renewed successfully."
);

}


/* =========================================================
   RECEIPT
========================================================= */

function createReceipt(){

const member =
members.find(
m =>
String(m.id) ===
String(currentProfileId)
);

if(!member) return;

const {
jsPDF
} = window.jspdf;

const pdf =
new jsPDF();

const total =
Number(member.entryFee || 0) +
Number(member.membershipFee || 0);


pdf.setFontSize(22);

pdf.text(
"DOLE WALA GYM",
105,
20,
{align:"center"}
);

pdf.setFontSize(13);

pdf.text(
"PAYMENT RECEIPT",
105,
30,
{align:"center"}
);

pdf.line(
20,
36,
190,
36
);

let y = 52;

async function backupData(){

const backup = {

gym:
"डोले Wala Gym",

date:
new Date().toISOString(),

members:
members

};

const blob =
new Blob(
[
JSON.stringify(
backup,
null,
2
)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(
blob
);

const a =
document.createElement("a");

a.href =
url;

a.download =
"Dole-Wala-Gym-Backup-" +
new Date()
.toISOString()
.split("T")[0] +
".json";

a.click();

URL.revokeObjectURL(url);

}


/* =========================================================
   RESTORE
========================================================= */

async function restoreData(event){

const file =
event.target.files[0];

if(!file) return;

try{

const text =
await file.text();

const backup =
JSON.parse(text);

if(
!backup.members ||
!Array.isArray(
backup.members
)
){

throw new Error(
"Invalid backup"
);

}

const ok =
confirm(
"Restore karne par current member list replace ho jayegi. Continue?"
);

if(!ok) return;

members =
backup.members;

saveData();

updateStatuses();

displayMembers();

updateDashboard();

alert(
"✅ Backup successfully restored."
);

}catch(e){

alert(
"❌ Backup file valid nahi hai."
);

}

event.target.value = "";

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

let active = 0;
let expired = 0;
let expiring = 0;

members.forEach(
member => {

const status =
getStatus(member);

if(status === "Active"){
active++;
}

else if(status === "Expired"){
expired++;
}

else{
expiring++;
}

});


document.getElementById(
"totalCount"
).textContent =
members.length;

document.getElementById(
"activeCount"
).textContent =
active;

document.getElementById(
"expiredCount"
).textContent =
expired;

document.getElementById(
"expiringCount"
).textContent =
expiring;

}

/* =========================================================
   SAFE HTML
========================================================= */

function safe(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
